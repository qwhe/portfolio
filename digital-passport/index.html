<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03142f"><meta name="robots" content="noindex,nofollow">
<title>Jerome.z · Digital Passport</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303142f'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%2321e6f3' stroke-width='3'/%3E%3Cpath fill='%23ff39c7' d='M8 14h4v-4h8v4h4v8h-4v-4h-8v4H8z'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#03142f;--panel:#091f45;--panel2:#102958;--cyan:#21e6f3;--pink:#ff39c7;--lime:#b8f43a;--text:#f2f7ff;--muted:#8cb5d9}*{box-sizing:border-box}button{font:inherit}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#14558b 0,transparent 42%),linear-gradient(180deg,#061c3d,var(--bg));font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);padding:18px 14px 34px}
.shell{width:min(100%,460px);min-height:calc(100svh - 52px);margin:auto;border:3px solid var(--cyan);box-shadow:6px 6px 0 var(--pink),-5px -5px 0 #2997ff;background:linear-gradient(180deg,#071a39,#020d20);padding:18px;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 5px,#21e6f308 6px)}header,.tabs,.cards,.footer{position:relative}
header{display:grid;grid-template-columns:78px 1fr;gap:15px;align-items:center;margin-bottom:18px}.avatar{width:78px;height:78px;border:3px solid var(--cyan);box-shadow:4px 4px 0 var(--pink);overflow:hidden;background:#6dbdeb}.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 42%;filter:saturate(1.35) contrast(1.12)}.kicker{margin:0 0 5px;color:var(--cyan);font-size:12px;letter-spacing:.14em}.name{margin:0;font-size:29px;line-height:1;text-shadow:3px 3px 0 #8f176f}.handle{margin:8px 0 0;color:var(--cyan);font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:2px solid #365680;background:var(--panel);color:var(--muted);padding:11px 3px;cursor:pointer;letter-spacing:.05em}.tab[aria-selected="true"]{border-color:var(--cyan);color:var(--cyan);background:#0b416b;box-shadow:3px 3px 0 #157aa6}
.cards{display:grid;gap:10px}.card{--card:#21e6f3;width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;text-align:left;border:2px solid #315a87;background:var(--panel);color:var(--text);padding:11px;cursor:pointer;box-shadow:3px 3px 0 #001022}.card:hover,.card:focus-visible{border-color:var(--card);outline:none;transform:translate(-1px,-1px)}.icon{display:grid;place-items:center;width:42px;height:42px;background:var(--card);color:#03142f;font-size:20px;font-weight:900}.platform{display:block;font-size:17px;font-weight:900}.account{display:block;color:var(--muted);font-size:13px;margin-top:4px}.arrow{color:var(--card);font-size:24px}.wechat{--card:#35d069}.rednote{--card:#ff4d63}.duolingo{--card:#b8f43a}.feishu{--card:#4d8dff}.opossum{--card:#ff39c7}
.portfolio{--card:#21e6f3;background:linear-gradient(135deg,#0b416b,var(--panel));text-decoration:none}.portfolio .icon{box-shadow:3px 3px 0 var(--pink)}.footer{margin-top:18px;padding-top:13px;border-top:2px solid #244c79;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.signal{color:var(--lime)}dialog{width:min(calc(100% - 28px),420px);border:0;padding:0;background:transparent;color:var(--text)}dialog::backdrop{background:#010816dc;backdrop-filter:blur(5px)}.modal{--card:var(--cyan);border:4px solid var(--card);background:#04152f;padding:18px;box-shadow:7px 7px 0 var(--pink);text-align:center}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal h2{margin:0;font-size:21px}.close{border:2px solid #506f96;background:var(--panel);color:var(--text);width:36px;height:36px;cursor:pointer}.qr{background:#fff;padding:10px}.qr img{display:block;width:100%;height:auto}.modal-account{font-size:17px;color:var(--card);margin:16px 0 11px}.copy{width:100%;border:2px solid var(--card);background:var(--panel2);color:var(--text);padding:12px;cursor:pointer}.hint{font:14px/1.5 system-ui,sans-serif;color:var(--muted);margin:12px 0 0}[hidden]{display:none!important}@media(min-width:700px){body{padding-top:36px}.shell{padding:24px}}
</style></head><body><main class="shell">
<header><div class="avatar"><img src="assets/cloud-avatar.png" alt="粉色像素云头像"></div><div><p class="kicker">DIGITAL PASSPORT</p><h1 class="name">Jerome.z</h1><p class="handle">@qwhe123</p></div></header>
<nav class="tabs" aria-label="身份分类"><button class="tab" data-tab="social" aria-selected="true">SOCIAL</button><button class="tab" data-tab="work" aria-selected="false">WORK</button><button class="tab" data-tab="play" aria-selected="false">PLAY</button></nav>
<section class="cards" aria-live="polite">
<button class="card wechat" data-group="social" data-title="WECHAT" data-account="qwhe123" data-image="assets/wechat.png"><span class="icon">W</span><span><span class="platform">WECHAT</span><span class="account">qwhe123</span></span><span class="arrow">›</span></button>
<button class="card rednote" data-group="social" data-title="REDNOTE" data-account="DailyIdea" data-image="assets/rednote.png"><span class="icon">R</span><span><span class="platform">REDNOTE</span><span class="account">DailyIdea</span></span><span class="arrow">›</span></button>
<a class="card portfolio" data-group="work" href="https://qwhe.github.io/portfolio/" target="_blank" rel="noopener" hidden><span class="icon">P</span><span><span class="platform">PORTFOLIO</span><span class="account">qwhe.github.io/portfolio</span></span><span class="arrow">↗</span></a>
<button class="card feishu" data-group="work" data-title="FEISHU" data-account="Jero" data-image="assets/feishu.png" hidden><span class="icon">F</span><span><span class="platform">FEISHU</span><span class="account">Jero · 联系我</span></span><span class="arrow">›</span></button>
<button class="card duolingo" data-group="play" data-title="DUOLINGO" data-account="qwhe123" data-image="assets/duolingo.png" hidden><span class="icon">D</span><span><span class="platform">DUOLINGO</span><span class="account">qwhe123</span></span><span class="arrow">›</span></button>
<button class="card opossum" data-group="play" data-title="POSSUM EMOJI" data-account="负鼠表情 · 微信小程序" data-image="assets/opossum.png" hidden><span class="icon">O</span><span><span class="platform">POSSUM EMOJI</span><span class="account">负鼠表情</span></span><span class="arrow">›</span></button>
</section><div class="footer"><span>NFC_LINK READY</span><span class="signal">● ONLINE</span></div></main>
<dialog id="passport-dialog"><div class="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" aria-label="关闭">×</button></div><div class="qr"><img id="modal-qr" alt=""></div><p class="modal-account" id="modal-account"></p><button class="copy" id="copy-account">复制账号</button><p class="hint">长按二维码可保存，或使用对应应用扫一扫</p></div></dialog>
<script>const tabs=[...document.querySelectorAll('.tab')],cards=[...document.querySelectorAll('.card')],dialog=document.querySelector('dialog');tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(t=>t.setAttribute('aria-selected',String(t===tab)));cards.forEach(card=>card.hidden=card.dataset.group!==tab.dataset.tab)}));document.querySelectorAll('button.card').forEach(card=>card.addEventListener('click',()=>{dialog.querySelector('.modal').className=`modal ${card.classList[1]}`;document.querySelector('#modal-title').textContent=card.dataset.title;document.querySelector('#modal-account').textContent=card.dataset.account;const image=document.querySelector('#modal-qr');image.src=card.dataset.image;image.alt=`${card.dataset.title} 二维码`;dialog.showModal()}));document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});document.querySelector('#copy-account').addEventListener('click',async event=>{await navigator.clipboard.writeText(document.querySelector('#modal-account').textContent);event.currentTarget.textContent='已复制';setTimeout(()=>event.currentTarget.textContent='复制账号',1200)});</script>
</body></html>
